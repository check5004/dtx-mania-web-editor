<text x="48" y="122" font-size="50" fill="#E8EEF6" font-weight="700" letter-spacing="0.5"><tspan x="48">DTX Web Editor</tspan></text>
<text x="50" y="172" font-size="22" fill="#CFE3F5"><tspan x="50">原曲を聴きながら、ブラウザでドラム譜面を作る。</tspan></text>
<text x="50" y="213" font-size="15.5" fill="#93A1B3"><tspan x="50">DTXManiaNX 向けの、無料のドラム譜面エディタ。</tspan><tspan x="50" dy="24.8">インストールなしで、PC・iPad・iPhone から。</tspan></text>
