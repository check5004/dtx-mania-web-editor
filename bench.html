<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>耳コピ精度テスト</title>
    <meta name="description" content="手元のDTX曲から正解付きのテスト曲を作り、打点の自動推定の精度をF値で測ります。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='1' width='20' height='20' rx='6' fill='%234CC2FF'/%3E%3Crect x='5' y='13' width='4' height='3' rx='1' fill='%230B0E13'/%3E%3Crect x='9' y='8' width='4' height='3' rx='1' fill='%230B0E13'/%3E%3Crect x='13' y='4' width='4' height='3' rx='1' fill='%230B0E13'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0b0e13;
        --card: #12161d;
        --line: #232a34;
        --text: #e7ebf1;
        --text2: #a3adbb;
        --mute: #8b95a4;
        --accent: #4cc2ff;
        --amber: #ffc768;
        --ok: #5bd69a;
        --bad: #ff5a61;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 'IBM Plex Sans JP', system-ui, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      h2 { font-size: 16px; margin: 28px 0 10px; }
      p { margin: 0 0 10px; color: var(--text2); }
      a { color: var(--accent); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
      .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      button { background: var(--accent); color: #06121b; border: 0; border-radius: 7px; padding: 7px 16px; font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; }
      button.sub { background: #1c222b; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
      button:disabled { opacity: 0.45; cursor: default; }
      .lbl { color: var(--mute); font-size: 12px; }
      .mono { font-family: var(--mono); }
      .status { font-family: var(--mono); font-size: 12px; color: var(--amber); min-height: 1.6em; }
      .scroll { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
      th:first-child, td:first-child, th.l, td.l { text-align: left; }
      th { color: var(--mute); font-weight: 500; font-size: 12px; }
      td.f { font-family: var(--mono); }
      td.f small { display: block; color: var(--mute); font-size: 10.5px; line-height: 1.3; }
      .bar { display: inline-block; height: 4px; border-radius: 2px; background: var(--accent); vertical-align: middle; }
      details { margin: 8px 0; }
      summary { cursor: pointer; color: var(--text2); }
      ul { margin: 6px 0; padding-left: 20px; color: var(--text2); }
      .songs label { min-width: 240px; }
    </style>
  </head>
  <body>
    <main>
      <h1>耳コピ精度テスト</h1>
      <p>手元のDTX曲から「答えの分かっているテスト曲」を作り、原曲から打点を推定する方式の当たり具合を F 値（0〜1、1が満点）で測ります。曲のデータはこのブラウザの中だけで使い、どこにも送りません。</p>
      <div class="card">
        <div class="row">
          <label><input id="pick" type="file" webkitdirectory multiple /></label>
          <span class="lbl">曲フォルダか、曲フォルダがいくつも入ったフォルダを選びます。いちばんチップの多い譜面（ふつうは MASTER）を正解にします。</span>
        </div>
        <div id="songs" class="songs row" style="margin-top: 10px"></div>
      </div>
      <div class="card">
        <div class="row" id="mixes"></div>
        <div class="row" style="margin-top: 8px">
          <label>許容のずれ <select id="tol"><option value="0.05" selected>±50ms</option><option value="0.03">±30ms</option><option value="0.025">±25ms</option></select></label>
          <label><input id="wav" type="checkbox" /> 混ぜた音を WAV で保存できるようにする（メモリを多く使います）</label>
        </div>
        <div class="row" style="margin-top: 12px">
          <button id="run" disabled>測る</button>
          <button id="json" class="sub" disabled>結果を JSON で保存</button>
          <span id="status" class="status"></span>
        </div>
      </div>
      <div id="out"></div>
    </main>
    <script type="module" src="/src/bench/main.ts"></script>
  </body>
</html>
